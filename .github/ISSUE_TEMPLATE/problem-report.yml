name: Problem report
description: Report a broken link, an inaccurate statement, outdated guidance, or unclear wording.
title: "[Problem]: "
labels:
  - documentation
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form to report a problem with existing documentation. A useful report links to the page, describes what is wrong, and explains how you know.

        This repository is public. Do not include credentials, account or tenant identifiers, internal hostnames, personal file paths, or client details.
  - type: input
    id: page
    attributes:
      label: Page
      description: Link to the page that has the problem.
    validations:
      required: true
  - type: dropdown
    id: problem-type
    attributes:
      label: Type of problem
      options:
        - Broken link or image
        - Inaccurate statement
        - Outdated guidance
        - Unclear or hard to follow
        - Sensitive information that should be removed
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What is wrong
      description: Quote or describe the text that has the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Describe what the page should say or do instead. A suggested correction is welcome.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: How do you know the current text is wrong? Link to public sources where possible.
    validations:
      required: false
  - type: checkboxes
    id: public-content
    attributes:
      label: Public content
      options:
        - label: This report contains no credentials, private identifiers, internal hostnames, personal file paths, or client details.
          required: true
